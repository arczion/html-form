<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Basics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="right">
        <div class="logo-wrapper">
            <img src="images/odin-lined.png">
            <p>Odin</p>            
        </div>
        <p class="credits">Photo by 
                <a href="https://unsplash.com/photos/25xggax4bSA">Halie West</a>
                 on 
                 <a href="www.unsplash.com">Unsplash</a>
        </p>
    </div>
    <div class="left">
        <div class="header">
            <p>This is not a real online service! You know you need something like this in your life to help
                you realize your deepest dreams.<br>
                Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
        </div>
        
            <form action="" method="get">
                <div class="form-wrapper">
                    <h2>Let's do this!</h2>
                    <div class="form-fields">
                        <div class="form-row">
                            <label for="first-name">First Name</label>
                            <input id="first-name" name="first-name" type="text" required/>
                        </div>
                        <div class="form-row">
                            <label for="last-name">Last Name</label>
                            <input id="last-name" name="last-name" type="text" required/>
                        </div>
                        <div class="form-row">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" required/>
                        </div>
                        <div class="form-row">
                            <label for="phone-number">Phone Number</label>
                            <input id="phone-number" name="phone-number" type="tel" />
                        </div>
                        <div class="form-row">
                            <label for="password">Password</label>
                            <input id="password" name="password" type="password" required/>
                        </div>
                    <div class="form-row">
                        <label for="confirm-password">Confirm Password</label>
                        <input id="confirm-password" name="confirm-password" type="password" required />
                    </div>
                    </div>
                </div>
                <div class="form-actions">
                        <button>Create Account</button>
                        <p>Already have an account? <a href="">Log in</a></p>
                </div>
                
            </form>
        </div>
    </body>
</html>
