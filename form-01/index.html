<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
   <div class="main-wrapper">
    
            <div class="left-column">
                <div class="logo">
                    <img src="images/odin-lined.png" alt="Odin logo">
                    <p class="logo-text">ODIN</p>
                </div>
                    <p class="photo-credit">Photo by <a href="https://unsplash.com/photos/25xggax4bSA">Halie West</a> on <a href="https://unsplash.com">Unsplash</a></p>
            </div>
            
            <div class="right-column">
                <div class="right-column-header">
                    <p class="header-text">This is not a real online service! You need something like this in your life to help you realise your own dreams. Sign up now to get started.</p>
                    <p class="header-cta">You <em>know</em> you want to.</p>
                </div>
                <div class="form-wrapper">
                    <form action="" method="get">
                        <div class="form-band">
                            <section class="form-wrapper-contents">
                        <h2>Let's do this!</h2>
                            <p>
                                <label for="first_name">FIRST NAME</label>
                                <input type="text" name="first_name" id="first_name" required>
                            </p>
                            <p>
                                 <label for="last_name">LAST NAME</label>
                                 <input type="text" id="last_name" name="last_name" required>
                            </p>
                            <p>
                                <label for="user_email">EMAIL</label>
                                <input type="email" name="user_email" id="user_email" required>
                            </p>
                            <p>
                                <label for="phone_number">PHONE NUMBER</label>
                                <input type="tel" id="phone_number" name="phone_number">
                            </p>
                            <p>
                                <label for="user_password">PASSWORD</label>
                                <input type="password" id="user_password" name="password" required minlength="8"> 
                            </p>
                            <p>
                                <label for="confirm_password">CONFIRM PASSWORD</label>
                                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" > 
                            </p>
                            </section>
                        </div>

                        <p class="button">
                                <button type="submit">Create Account</button>
                        </p> 
                         <p class="form-wrapper-cta">Already have an account? <a href="">Log in</a></p>
   
                    </form>
                </div>
        </div>
   </div> 
</body>
</html>
